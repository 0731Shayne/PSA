name: Probability Tutor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      DEEPSEEK_MOCK: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mra_test
          POSTGRES_USER: mra
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mra -d mra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://mra:test-password@localhost:5432/mra_test
      DEEPSEEK_MOCK: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:math
      - run: npm run test:ui
      - run: npm run test:experiments
      - run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r ../backend/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_PYTHON: python
      - run: npm run test:demo

  docker-compose-smoke:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      POSTGRES_DB: mra_ci
      POSTGRES_USER: mra
      POSTGRES_PASSWORD: 'ci@database:%password'
      BOOTSTRAP_TEACHER_USERNAME: ci-teacher
      BOOTSTRAP_TEACHER_PASSWORD: ci-only-initial-teacher-password
      DEEPSEEK_MOCK: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Build and start production stack
        run: docker compose -f backend/docker-compose.yml up --build -d
      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8101/health/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify teacher onboarding and protected question bank
        run: |
          python3 - <<'PY'
          import json
          import os
          from http.cookies import SimpleCookie
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          def request(path, *, payload=None, token=None, expected=200):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Cookie"] = f"mra_session={token}"
              request = Request("http://127.0.0.1:8101" + path, data=data, headers=headers)
              try:
                  response = urlopen(request, timeout=15)
              except HTTPError as exc:
                  response = exc
              with response:
                  assert response.status == expected, (path, response.status, expected)
                  return json.load(response), SimpleCookie(response.headers.get("Set-Cookie", ""))

          username = os.environ["BOOTSTRAP_TEACHER_USERNAME"]
          password = os.environ["BOOTSTRAP_TEACHER_PASSWORD"]
          user, cookies = request("/api/auth/login", payload={"username": username, "password": password})
          assert user["user"]["role"] == "teacher" and user["user"]["must_change_password"]
          initial = cookies["mra_session"]
          assert initial["secure"] and initial["httponly"] and initial["samesite"].lower() == "lax"
          request("/api/question-bank/stats", token=initial.value, expected=403)
          _, cookies = request("/api/auth/change-password", payload={
              "current_password": password, "new_password": "ci-only-changed-teacher-password",
          }, token=initial.value)
          request("/api/auth/me", token=initial.value, expected=401)
          stats, _ = request("/api/question-bank/stats", token=cookies["mra_session"].value)
          assert stats["total"] == 2_000
          status, _ = request("/api/auth/dev-login/status")
          assert status["enabled"] is False
          PY
      - name: Restore a backup to an isolated database
        run: |
          docker compose -f backend/docker-compose.yml exec -T db pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc > "$RUNNER_TEMP/psa.backup"
          docker compose -f backend/docker-compose.yml exec -T db createdb -U "$POSTGRES_USER" psa_restore_check
          docker compose -f backend/docker-compose.yml exec -T db pg_restore --exit-on-error -U "$POSTGRES_USER" -d psa_restore_check < "$RUNNER_TEMP/psa.backup"
          restored=$(docker compose -f backend/docker-compose.yml exec -T db psql -U "$POSTGRES_USER" -d psa_restore_check -Atc "SELECT count(*) FROM users WHERE role = 'teacher' AND NOT must_change_password")
          test "$restored" = "1"
      - name: Show application logs on failure
        if: failure()
        run: docker compose -f backend/docker-compose.yml logs app
      - name: Stop test stack
        if: always()
        run: docker compose -f backend/docker-compose.yml down -v
