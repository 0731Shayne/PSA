services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mra}
      POSTGRES_USER: ${POSTGRES_USER:-mra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mra} -d ${POSTGRES_DB:-mra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8101
      SECRET_KEY: ${SECRET_KEY:?请配置至少32个字符的 SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MOCK: ${DEEPSEEK_MOCK:-false}
      MINERU_TOKEN: ${MINERU_TOKEN:-}
      MINERU_BASE_URL: ${MINERU_BASE_URL:-https://mineru.net/api/v4}
      MINERU_MODEL: ${MINERU_MODEL:-vlm}
      MINERU_TIMEOUT_SECONDS: ${MINERU_TIMEOUT_SECONDS:-120}
      MINERU_USE_ENV_PROXY: ${MINERU_USE_ENV_PROXY:-false}
      KNOWLEDGE_BACKEND: ${KNOWLEDGE_BACKEND:-disabled}
      LOCAL_EMBEDDING_BASE_URL: ${LOCAL_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-bge-m3}
      LOCAL_EMBEDDING_TIMEOUT_SECONDS: ${LOCAL_EMBEDDING_TIMEOUT_SECONDS:-60}
      LOCAL_EMBEDDING_USE_ENV_PROXY: ${LOCAL_EMBEDDING_USE_ENV_PROXY:-false}
      LOCAL_EMBEDDING_BATCH_SIZE: ${LOCAL_EMBEDDING_BATCH_SIZE:-16}
      LOCAL_CHUNK_SIZE: ${LOCAL_CHUNK_SIZE:-900}
      LOCAL_CHUNK_OVERLAP: ${LOCAL_CHUNK_OVERLAP:-120}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://host.docker.internal:9380}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      RAGFLOW_EMBEDDING_MODEL: ${RAGFLOW_EMBEDDING_MODEL:-}
      RAGFLOW_RERANK_ID: ${RAGFLOW_RERANK_ID:-}
      RAGFLOW_CHUNK_METHOD: ${RAGFLOW_CHUNK_METHOD:-book}
      RAGFLOW_TIMEOUT_SECONDS: ${RAGFLOW_TIMEOUT_SECONDS:-30}
      RAGFLOW_VERIFY_SSL: ${RAGFLOW_VERIFY_SSL:-true}
      RAGFLOW_USE_ENV_PROXY: ${RAGFLOW_USE_ENV_PROXY:-false}
      RAGFLOW_MAX_FILE_MB: ${RAGFLOW_MAX_FILE_MB:-50}
      RAGFLOW_RETRIEVAL_PAGE_SIZE: ${RAGFLOW_RETRIEVAL_PAGE_SIZE:-6}
      RAGFLOW_SIMILARITY_THRESHOLD: ${RAGFLOW_SIMILARITY_THRESHOLD:-0.2}
      RAGFLOW_VECTOR_SIMILARITY_WEIGHT: ${RAGFLOW_VECTOR_SIMILARITY_WEIGHT:-0.5}
      RAGFLOW_TOP_K: ${RAGFLOW_TOP_K:-256}
      TEACHER_REGISTRATION_CODE: ${TEACHER_REGISTRATION_CODE:-}
      BOOTSTRAP_TEACHER_USERNAME: ${BOOTSTRAP_TEACHER_USERNAME:-}
      BOOTSTRAP_TEACHER_PASSWORD: ${BOOTSTRAP_TEACHER_PASSWORD:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mra}
      QUESTION_BANK_PATH: /app/data/probability_questions.jsonl
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8101}:8101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
